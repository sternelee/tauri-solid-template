
[package]
name = "tauri-solid-app"
version = "0.0.0"
description = "created with Quantum template"
license = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-devtools = "2"
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "javascript", "typescript"] }
specta = { version = "=2.0.0-rc.22" }
specta-typescript = { version = "0.0.9" }
log = "0.4.22"


# Optimize for smaller binary size
[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Remove debug symbols
