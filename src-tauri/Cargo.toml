[package]
name = "app"
version = "0.0.0"
description = "created with Quantum template"
license = ""
edition = "2021"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-devtools = "2.0"
specta = { version = "=2.0.0-rc.20", features = ["serde_json"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-screenshots = "2"
tauri-plugin-biometry = "0.2"
tauri-plugin-mic-recorder = "2.0.0"
tauri-plugin-cache = "0.1.5"
applications = "0.3.1"
glob = "0.3.3"
dirs = "5.0.1"
tauri-specta = { version = "=2.0.0-rc.20", features = [
  "derive",
  "javascript",
  "typescript",
] }
specta-typescript = "0.0.7"
log = "0.4.22"
anyhow = "1.0"

# Rig AI agent dependencies
rig-core = { version = "0.22.0", features = [
  "derive",
  "audio",
  "image",
  "reqwest-rustls",
] }

# Note: rig-core provides its own provider implementations
# We use the providers from rig-core directly
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = "1.0"

# Additional dependencies for enhanced AI features
base64 = "0.22"
image = { version = "0.25" }
mime_guess = "2.0"
url = "2.5"
walkdir = "2.5"
sysinfo = "0.32"
dirs-next = "2.0"
serde_yaml = "0.9"
toml = "0.8"
async-trait = "0.1"
hostname = "0.4"
regex = "1.11"

# Database dependencies
libsql = "0.9.24"
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "chrono",
  "uuid",
] }

# ripgrep crate doesn't have a lib target, we'll use std::process instead

[target.'cfg(target_os = "macos")'.dependencies]
tauri-icns = "0.1.0"

# Additional dependencies for text selection and window management
open = "5.3"
arboard = "3.4"

# Screenshot dependencies - now using tauri-plugin-screenshots


# Optimize for smaller binary size
[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Remove debug symbols
